# Example nginx site that serves the feeds and MP3s over HTTPS.
server {
    listen 443 ssl;
    server_name nrk-flash.example.no;

    ssl_certificate     /etc/letsencrypt/live/nrk-flash.example.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nrk-flash.example.no/privkey.pem;

    root /var/www/nrk-flash;

    location ~ \.json$ {
        default_type application/json;
        add_header Cache-Control "no-cache";
    }
    location ~ \.mp3$ {
        default_type audio/mpeg;
        add_header Cache-Control "public, max-age=86400";
    }
}
